[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indie-books-atlas-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "supabase==2.9.1",
    "httpx==0.27.2",
    "pydantic==2.11.10",
    "pydantic-settings==2.8.1",
    "structlog==24.2.0",
    "click==8.1.7",
    "tenacity==8.5.0",
    "python-slugify==8.0.4",
    "phonenumbers==8.13.42",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-cov==5.0.0",
    "pytest-httpx==0.30.0",
    "black==24.4.2",
    "ruff==0.5.2",
    "isort==5.13.2",
]

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pipeline --cov-report=term-missing --cov-fail-under=70"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
omit = [
    "pipeline/db/*",
    "pipeline/jobs/*",
    "pipeline/sources/*",
]

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
ignore = ["E501"]

[tool.isort]
profile = "black"
line_length = 100
