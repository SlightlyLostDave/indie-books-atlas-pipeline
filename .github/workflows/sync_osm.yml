name: Sync OSM

on:
  schedule:
    - cron: "0 4 * * 1"  # 04:00 UTC every Monday
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e "."

      - name: Run OSM sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OVERPASS_API_URL: ${{ vars.OVERPASS_API_URL || 'https://overpass-api.de/api/interpreter' }}
          LOG_LEVEL: INFO
        run: python scripts/run_sync_osm.py
